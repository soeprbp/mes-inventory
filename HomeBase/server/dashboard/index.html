<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Inventory Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: var(--light);
            color: var(--dark);
        }
        
        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        nav a {
            margin-left: 1.5rem;
            color: var(--secondary);
            text-decoration: none;
        }
        
        nav a.active, nav a:hover {
            color: var(--primary);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }
        
        .stat-card h3 {
            color: var(--secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .table-container {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .table-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: var(--light);
            font-weight: 500;
            color: var(--secondary);
        }
        
        tr:hover {
            background: #f1f5f9;
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .badge-success { background: #dcfce7; color: var(--success); }
        .badge-warning { background: #fef3c7; color: var(--warning); }
        .badge-danger { background: #fee2e2; color: var(--danger); }
        
        .search-box {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 300px;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-secondary {
            background: var(--secondary);
            color: white;
        }
        
        #loading {
            text-align: center;
            padding: 2rem;
        }
        
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .search-box { width: 100%; margin-top: 1rem; }
            .table-header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">MES Inventory</div>
        <nav>
            <a href="#" class="active" data-tab="dashboard">Dashboard</a>
            <a href="#" data-tab="machines">Machines</a>
            <a href="#" data-tab="software">Software</a>
            <a href="#" data-tab="mes">MES Devices</a>
            <a href="#" data-tab="reports">Reports</a>
        </nav>
    </header>

    <div class="container" id="content">
        <div id="loading">Loading...</div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:5000/api';

        // Security: HTML entity encoder to prevent XSS
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        // Security: Get API token from user or config
        let API_TOKEN = '';

        // Show authentication setup UI
        function showAuthSetup(container) {
            container.innerHTML = `
                <div style="max-width: 400px; margin: 3rem auto; text-align: center;">
                    <h2>MES Inventory - Authentication Required</h2>
                    <p style="color: #64748b; margin: 1rem 0;">Enter your API token to access the dashboard.</p>
                    <input type="password" id="api-token-input" placeholder="Enter API Token" 
                           style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 1rem;">
                    <button onclick="submitToken()" class="btn btn-primary" style="width: 100%;">Connect</button>
                    <p id="auth-error" style="color: #dc2626; margin-top: 1rem; display: none;"></p>
                </div>
            `;
        }

        function submitToken() {
            const input = document.getElementById('api-token-input');
            const errorEl = document.getElementById('auth-error');
            API_TOKEN = input.value.trim();
            
            if (!API_TOKEN) {
                errorEl.textContent = 'Please enter a token';
                errorEl.style.display = 'block';
                return;
            }
            
            // Test the token by fetching stats
            fetch(`${API_BASE}/stats?token=${encodeURIComponent(API_TOKEN)}`)
                .then(r => {
                    if (r.ok) {
                        errorEl.style.display = 'none';
                        loadTab('dashboard');
                    } else if (r.status === 401) {
                        errorEl.textContent = 'Invalid token';
                        errorEl.style.display = 'block';
                    } else {
                        errorEl.textContent = 'Connection error';
                        errorEl.style.display = 'block';
                    }
                })
                .catch(() => {
                    errorEl.textContent = 'Cannot connect to server';
                    errorEl.style.display = 'block';
                });
        }

        // Tab navigation
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('nav a').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                loadTab(link.dataset.tab);
            });
        });

        async function loadTab(tab) {
            const content = document.getElementById('content');
            content.innerHTML = '<div id="loading">Loading...</div>';
            
            try {
                // If no token configured, show setup prompt
                if (!API_TOKEN) {
                    showAuthSetup(content);
                    return;
                }
                
                switch(tab) {
                    case 'dashboard':
                        await loadDashboard(content);
                        break;
                    case 'machines':
                        await loadMachines(content);
                        break;
                    case 'software':
                        await loadSoftware(content);
                        break;
                    case 'mes':
                        await loadMesDevices(content);
                        break;
                    case 'reports':
                        loadReports(content);
                        break;
                }
            } catch (error) {
                content.innerHTML = `<div class="stat-card"><h3>Error</h3><p>Failed to load data: ${error.message}</p></div>`;
            }
        }

        async function loadDashboard(container) {
            const response = await fetch(`${API_BASE}/stats`);
            const stats = await response.json();
            
            container.innerHTML = `
                <h2 style="margin-bottom: 1rem;">Dashboard Overview</h2>
                <div class="stats">
                    <div class="stat-card">
                        <h3>Total Machines</h3>
                        <div class="value">${escapeHtml(stats.total_machines)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Machines Today</h3>
                        <div class="value">${escapeHtml(stats.machines_today)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Unique Software</h3>
                        <div class="value">${escapeHtml(stats.total_software)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>MES Devices</h3>
                        <div class="value">${escapeHtml(stats.total_mes_devices)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Running Services</h3>
                        <div class="value">${escapeHtml(stats.running_services)}</div>
                    </div>
                </div>
                <div class="table-container">
                    <div class="table-header">
                        <h3>Recent Machines</h3>
                    </div>
                    <table>
                        <thead><tr><th>Hostname</th><th>Last Seen</th></tr></thead>
                        <tbody>
                            ${stats.recent_machines.map(m => `
                                <tr>
                                    <td>${escapeHtml(m.hostname)}</td>
                                    <td>${new Date(m.last_seen).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function loadMachines(container) {
            const response = await fetch(`${API_BASE}/machines?token=${encodeURIComponent(API_TOKEN)}`);
            const machines = await response.json();
            
            container.innerHTML = `
                <h2 style="margin-bottom: 1rem;">Machines</h2>
                <div class="table-container">
                    <div class="table-header">
                        <input type="text" class="search-box" placeholder="Search machines..." id="machine-search">
                    </div>
                    <table>
                        <thead><tr><th>Hostname</th><th>Location</th><th>Asset Tag</th><th>Software</th><th>Last Seen</th></tr></thead>
                        <tbody id="machine-table">
                            ${machines.map(m => `
                                <tr>
                                    <td>${escapeHtml(m.hostname)}</td>
                                    <td>${escapeHtml(m.location || '-')}</td>
                                    <td>${escapeHtml(m.asset_tag || '-')}</td>
                                    <td>${escapeHtml(m.software_count || 0)}</td>
                                    <td>${new Date(m.last_seen).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('machine-search').addEventListener('input', async (e) => {
                const q = e.target.value;
                if (q.length > 0) {
                    const res = await fetch(`${API_BASE}/machines?search=${q}`);
                    const data = await res.json();
                    // Update table
                }
            });
        }

        async function loadSoftware(container) {
            const response = await fetch(`${API_BASE}/software?token=${encodeURIComponent(API_TOKEN)}`);
            const software = await response.json();
            
            container.innerHTML = `
                <h2 style="margin-bottom: 1rem;">Software Inventory</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Name</th><th>Version</th><th>Publisher</th><th>Installed On</th></tr></thead>
                        <tbody>
                            ${software.slice(0, 50).map(s => `
                                <tr>
                                    <td>${escapeHtml(s.name)}</td>
                                    <td>${escapeHtml(s.version)}</td>
                                    <td>${escapeHtml(s.publisher)}</td>
                                    <td>${escapeHtml(s.installed_on_list.length)} machines</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function loadMesDevices(container) {
            const response = await fetch(`${API_BASE}/mes-devices?token=${encodeURIComponent(API_TOKEN)}`);
            const devices = await response.json();
            
            container.innerHTML = `
                <h2 style="margin-bottom: 1rem;">MES Devices</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>IP Address</th><th>Port</th><th>Protocol</th><th>Vendor</th><th>Last Seen</th></tr></thead>
                        <tbody>
                            ${devices.map(d => `
                                <tr>
                                    <td>${escapeHtml(d.ip_address)}</td>
                                    <td>${escapeHtml(d.port)}</td>
                                    <td>${escapeHtml(d.protocol)}</td>
                                    <td>${escapeHtml(d.vendor)}</td>
                                    <td>${new Date(d.last_seen).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function loadReports(container) {
            container.innerHTML = `
                <h2 style="margin-bottom: 1rem;">Reports</h2>
                <div class="stats">
                    <div class="stat-card">
                        <h3>Export Options</h3>
                        <div style="margin-top: 1rem;">
                            <button class="btn btn-primary" onclick="exportData('machines', 'csv')">Export Machines (CSV)</button>
                            <button class="btn btn-primary" onclick="exportData('software', 'csv')">Export Software (CSV)</button>
                            <button class="btn btn-primary" onclick="exportData('mes', 'csv')">Export MES (CSV)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportData(type, format) {
            window.open(`${API_BASE}/export/${format}?type=${type}&token=${encodeURIComponent(API_TOKEN)}`, '_blank');
        }

        // Load dashboard by default
        loadTab('dashboard');
    </script>
</body>
</html>
